[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py
testpaths = tests orders
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# D: — значення за замовчуванням: локально тести йдуть на SQLite, у Docker (де DB_ENGINE=postgres
# уже задано в оточенні) — на PostgreSQL.
env =
    D:DB_ENGINE=sqlite
# Покриття рахується автоматично. Для одного тесту: pytest --no-cov path::test
addopts = -ra --strict-markers --cov --cov-config=.coveragerc --cov-report=term-missing:skip-covered --cov-fail-under=70
filterwarnings =
    ignore::DeprecationWarning
    ignore:No directory at:UserWarning
